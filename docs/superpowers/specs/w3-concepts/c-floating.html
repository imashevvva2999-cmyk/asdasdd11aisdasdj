<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mmusic Concept C</title>
<!-- Concept C — Floating Minimalism. Design review mockup, not app code. ?v=home | player | queue -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<style>
:root { --canvas:#0A0A0C; --l1:#141418; --l2:#1C1C24; --ink:#FFFFFF; --mid:#9E9EA8; --low:#5A5A66; --edge:rgba(255,255,255,0.08); --coral:#FF4B4B; --gold:#F5A623;
  --p-bg:#4a488e; --p-deep:#23223f; --p-acc:#5d5bbe; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--canvas); color:var(--ink); font:400 15px/22px Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
img { display:block; width:100%; height:100%; object-fit:cover; }
.mi { font-family:'Material Icons'; font-size:22px; line-height:1; font-feature-settings:'liga'; }
.eqmark { display:inline-flex; gap:2px; align-items:center; height:18px; } .eqmark i { width:3px; border-radius:2px; background:var(--coral); }
.disp { font-family:'Plus Jakarta Sans'; font-weight:800; letter-spacing:-0.04em; }
.float { background:var(--l1); border:1px solid var(--edge); box-shadow:0 24px 48px -16px rgba(0,0,0,0.7); }

/* Floating navigation pill, top centre */
.navpill { position:fixed; top:22px; left:50%; transform:translateX(-50%); height:56px; padding:0 8px 0 18px; border-radius:999px; display:flex; align-items:center; gap:6px; z-index:5; }
.navpill .logo { display:flex; align-items:center; gap:8px; font:800 18px 'Plus Jakarta Sans'; letter-spacing:-0.04em; margin-right:14px; }
.navpill a { height:40px; padding:0 16px; border-radius:999px; display:grid; place-items:center; font:600 14px Inter; color:var(--mid); }
.navpill a.on { background:var(--ink); color:var(--canvas); }
.navpill .sep { width:1px; height:24px; background:var(--edge); margin:0 6px; }
.navpill .ic { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--mid); }
.navpill .av { width:40px; height:40px; border-radius:50%; background:var(--l2); display:grid; place-items:center; font:700 12px Inter; }
.navpill.min { padding:0 8px; gap:10px; }
.navpill.min .ic { color:var(--ink); }
.navpill.min span.t { font:600 13px Inter; color:var(--mid); } .navpill.min b { font:600 13px Inter; }

/* Home: objects floating on the canvas */
.home { position:fixed; inset:0; padding:118px 0 0; }
.wrap { width:1160px; margin:0 auto; }
.lede h2 { font:800 40px/44px 'Plus Jakarta Sans'; letter-spacing:-0.04em; }
.lede p { color:var(--mid); font-size:15px; margin-top:6px; }
.shelf { display:grid; grid-template-columns:repeat(6,1fr); gap:32px; margin-top:26px; }
.shelf .cv { aspect-ratio:1; border-radius:50%; overflow:hidden; box-shadow:0 20px 40px -18px rgba(0,0,0,0.8); position:relative; }
.shelf b { display:block; text-align:center; margin-top:14px; font:600 15px Inter; }
.shelf .hov .cv { outline:3px solid var(--ink); outline-offset:4px; }
.shelf .hov .cv::after { content:'play_arrow'; font-family:'Material Icons'; position:absolute; inset:0; margin:auto; width:56px; height:56px; border-radius:50%; background:var(--coral); display:grid; place-items:center; font-size:32px; }
.duo { display:grid; grid-template-columns:420px 1fr; gap:64px; align-items:center; margin-top:56px; }
.duo .cv { height:260px; border-radius:32px; overflow:hidden; }
.duo .k { font:600 13px Inter; color:var(--gold); }
.duo h3 { font-size:54px; line-height:0.98; margin:10px 0 12px; }
.duo p { color:var(--mid); font-size:16px; line-height:25px; max-width:460px; }
.duo .acts { display:flex; gap:10px; margin-top:20px; }
.pill { height:44px; padding:0 20px; border-radius:999px; display:inline-flex; gap:8px; align-items:center; font:600 14px Inter; }
.pill.coral { background:var(--coral); } .pill.quiet { border:1px solid var(--edge); }

/* Capsule player, bottom centre */
.capsule { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); height:68px; border-radius:999px; display:flex; align-items:center; gap:18px; padding:0 18px 0 10px; overflow:hidden; z-index:6; }
.capsule::after { content:''; position:absolute; left:0; bottom:0; height:2px; width:34%; background:var(--p-acc); }
.capsule .cv { width:48px; height:48px; border-radius:50%; overflow:hidden; flex:none; }
.capsule .ti b { display:block; font:600 14px Inter; } .capsule .ti span { font-size:12px; color:var(--mid); }
.capsule .ctl { display:flex; align-items:center; gap:14px; margin-left:12px; }
.capsule .pp { width:44px; height:44px; border-radius:50%; background:var(--coral); display:grid; place-items:center; }
.capsule .div { width:1px; height:28px; background:var(--edge); }
.capsule .mute { color:var(--mid); } .capsule .on { color:var(--coral); }
.capsule.wide { height:76px; gap:20px; padding:0 22px; }
.capsule.wide::after { display:none; }
.capsule .scrub { display:flex; align-items:center; gap:10px; width:300px; font:500 12px Inter; color:var(--mid); font-variant-numeric:tabular-nums; }
.capsule .scrub .tr { flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.16); position:relative; }
.capsule .scrub .tr i { position:absolute; left:0; top:0; bottom:0; width:34%; border-radius:2px; background:var(--ink); }

/* Now Playing: one object in the middle, a flat colour disc behind it */
.np { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding-top:108px; }
.disc { position:absolute; left:50%; top:52px; width:640px; height:640px; margin-left:-320px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--p-bg) 72%, var(--canvas)) 0%, color-mix(in srgb, var(--p-deep) 80%, var(--canvas)) 58%, var(--canvas) 71%); }
.np .art { position:relative; width:360px; height:360px; border-radius:36px; overflow:hidden; box-shadow:0 34px 60px -24px rgba(0,0,0,0.8); }
.np .arrows { position:absolute; top:266px; left:50%; width:520px; margin-left:-260px; display:flex; justify-content:space-between; }
.np .arrows span { width:44px; height:44px; border-radius:50%; background:rgba(10,10,12,0.5); display:grid; place-items:center; }
.np h1 { position:relative; font-size:52px; line-height:1; margin-top:34px; }
.np .by { position:relative; color:var(--mid); font:500 17px Inter; margin-top:8px; }
.focus { position:relative; text-align:center; margin-top:26px; }
.focus p { font:600 18px/26px 'Plus Jakarta Sans'; color:var(--low); }
.focus p.cur { font:700 30px/40px 'Plus Jakarta Sans'; letter-spacing:-0.02em; color:var(--ink); margin:4px 0; }

/* Queue / Lyrics: the capsule grows upward into a floating sheet */
.dim { position:fixed; inset:0; background:rgba(10,10,12,0.55); z-index:4; }
.sheet { position:fixed; left:50%; bottom:116px; transform:translateX(-50%); width:540px; border-radius:32px; padding:18px; z-index:6; }
.seg { display:flex; background:var(--l2); border-radius:999px; padding:4px; }
.seg span { flex:1; height:36px; border-radius:999px; display:grid; place-items:center; font:600 13px Inter; color:var(--mid); }
.seg span.on { background:var(--ink); color:var(--canvas); }
.sheet h4 { font:600 12px Inter; color:var(--mid); margin:16px 8px 6px; }
.row { display:grid; grid-template-columns:44px 1fr auto; gap:14px; align-items:center; height:58px; padding:0 8px; border-radius:18px; }
.row .cv { width:44px; height:44px; border-radius:50%; overflow:hidden; }
.row b { display:block; font:600 14px Inter; } .row span { font-size:12px; color:var(--mid); }
.row .d { font:500 12px Inter; color:var(--mid); font-variant-numeric:tabular-nums; }
.row.now b { color:var(--coral); }
.row.hov { background:var(--l2); }
</style>
</head>
<body>
<div id="root"></div>
<script src="common.js"></script>
<script>
const navpill = () => `<nav class="navpill float"><span class="logo">${EQ()}Mmusic</span><a class="on">Home</a><a>Search</a><a>Library</a><span class="sep"></span><span class="ic">${mi('search')}</span><span class="ic">${mi('notifications_none')}</span><span class="av">AR</span></nav>`;
const capsule = () => `<div class="capsule float"><div class="cv">${img(NOW.cover)}</div><div class="ti"><b>${NOW.title}</b><span>${NOW.artist}</span></div>
  <div class="ctl">${mi('skip_previous')}<div class="pp">${mi('pause')}</div>${mi('skip_next')}</div><span class="div"></span>${mi('lyrics', 'mute')}${mi('queue_music', 'mute')}${mi('open_in_full', 'mute')}</div>`;
const wideCapsule = (active) => `<div class="capsule wide float">${mi('favorite', 'on')}
  <div class="ctl" style="margin-left:0">${mi('shuffle', 'mute')}${mi('skip_previous')}<div class="pp">${mi('pause')}</div>${mi('skip_next')}${mi('repeat', 'mute')}</div>
  <div class="scrub"><span>${NOW.pos}</span><div class="tr"><i></i></div><span>${NOW.rem}</span></div><span class="div"></span>
  ${mi('lyrics', active === 'lyrics' ? 'on' : 'mute')}${mi('queue_music', active === 'queue' ? 'on' : 'mute')}${mi('volunteer_activism', 'mute')}${mi('headphones', 'mute')}${mi('volume_up', 'mute')}</div>`;
const nowPlaying = () => `<div class="np"><div class="disc"></div>
    <div class="art">${img(NOW.cover)}</div><div class="arrows"><span>${mi('chevron_left')}</span><span>${mi('chevron_right')}</span></div>
    <h1 class="disp">${NOW.title}</h1><div class="by">${NOW.artist}</div>
    <div class="focus"><p>${LYRICS[CURRENT_LINE - 1]}</p><p class="cur">${LYRICS[CURRENT_LINE]}</p><p>${LYRICS[CURRENT_LINE + 1]}</p></div></div>
  <nav class="navpill min float"><span class="ic">${mi('keyboard_arrow_down')}</span><span class="t">Playing from</span><b>${NOW.album}</b><span class="ic">${mi('more_horiz')}</span></nav>`;

mount({
  home: () => `${navpill()}<main class="home"><div class="wrap">
    <div class="lede"><h2>For you</h2><p>Mixes picked from what you play.</p></div>
    <div class="shelf">${FOR_YOU.map(([c, t], i) => `<div class="${i === 1 ? 'hov' : ''}"><div class="cv">${img(c)}</div><b>${t}</b></div>`).join('')}</div>
    <section class="duo"><div class="cv">${img(FEATURED.cover)}</div><div><span class="k">${FEATURED.kind}</span><h3 class="disp">${FEATURED.title}</h3><p>${FEATURED.blurb}</p>
      <div class="acts"><span class="pill coral">${mi('play_arrow')}Play</span><span class="pill quiet">${mi('favorite_border')}Save</span></div></div></section>
  </div></main>${capsule()}`,
  player: () => `${nowPlaying()}${wideCapsule('none')}`,
  queue: () => `${nowPlaying()}<div class="dim"></div>
    <section class="sheet float"><div class="seg"><span>Lyrics</span><span class="on">Queue</span></div>
      <h4>Now playing</h4><div class="row now"><div class="cv">${img(NOW.cover)}</div><div><b>${NOW.title}</b><span>${NOW.artist}</span></div><span class="d">4:00</span></div>
      <h4>Next</h4>${QUEUE.slice(0, 4).map(([c, t, a, d], i) => `<div class="row ${i === 1 ? 'hov' : ''}"><div class="cv">${img(c)}</div><div><b>${t}</b><span>${a}</span></div><span class="d">${i === 1 ? mi('play_arrow') : d}</span></div>`).join('')}
    </section>${wideCapsule('queue')}`,
});
</script>
</body>
</html>
