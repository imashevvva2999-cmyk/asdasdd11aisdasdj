  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between gap-space-md"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go back" class="min-h-[44px] min-w-[44px] -ml-space-sm flex items-center justify-center rounded-full text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><img alt="Mmusic brand logo: minimal, sleek, premium geometric 'M' soundwave emblem for a modern music streaming app.. Brand logo" class="h-8 w-auto object-contain shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1XKiSO5NwSxJ8BV9eqSNu8O01SO6dc4eP3yxcxC1q7XXtba_NL2kyt-bAZEUkGxyCp16VLiHSbmyVn-LlV1B4WiCEtYC2OY3A9yHTD4x_RCNWSNbrXhdPpc-hxZO3hOgtdududw7qxTquflUm0GyN6Wpa6ze8OswOJ28nGTYFP_fyAdNRROjsG9-_TXI4btTyeKOFOP-Vv_OznpsRXunmTBNaM7WiusRCzGcD3AQms2b0vzAEYGxBJSY1Y"><div class="flex flex-col min-w-0"><span class="font-headline-sm text-headline-sm text-on-surface truncate">Mmusic</span><span class="font-label-sm text-label-sm text-on-surface-variant truncate">Create Playlist</span></div></div><div class="flex items-center gap-space-sm shrink-0"><button aria-label="More options" class="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-[22px]">more_vert</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-12">
<div class="flex items-center justify-between px-margin py-space-sm bg-surface-container-low/60 backdrop-blur-md">
<button class="text-on-surface-variant hover:text-on-surface transition-colors py-2 font-label-lg text-label-lg" onclick="history.back()" type="button">
      Cancel
    </button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">
      Create Playlist
    </h1>
<button class="font-label-lg text-label-lg text-primary-container font-semibold transition-opacity opacity-50 cursor-not-allowed" id="navCreateBtn" onclick="triggerCreate()" type="button">
      Create
    </button>
</div>
<div class="flex flex-col items-center px-margin mt-space-lg w-full max-w-md mx-auto">
<div class="relative group cursor-pointer w-48 h-48 rounded-[20px] bg-surface-container-high flex flex-col items-center justify-center p-space-md shadow-xl overflow-hidden transition-all duration-300 hover:bg-surface-container-highest" onclick="document.getElementById('coverInput').click()">
<div class="flex flex-col items-center justify-center text-center gap-space-xs z-10" id="coverPlaceholder">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-primary-container mb-space-xs transition-transform duration-300 group-hover:scale-110">
<span class="material-symbols-outlined text-[24px]">add_a_photo</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-medium">Add Cover</span>
<span class="font-body-sm text-body-sm text-outline">Custom art or photo</span>
</div>
<img class="hidden absolute inset-0 w-full h-full object-cover rounded-[20px]" data-alt="Vibrant abstract soundwave visual art with glowing crimson, deep obsidian, and neon coral hues, smooth velvet textures, high fidelity audiophile aesthetic suitable for album cover" id="coverPreview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6nmVjN7kyztWRWJMVQUedyyYd7BMNN4eUp4rcD8O2Hyi6iVJFZLwtIlRtAzZ32FzUSW3zLGL3R8V89oOI3C4d_5G_xeu0c7Mf9uWzttJeP9_dU5Ay00A4W6JfBJ0IVpNoh2SovDSgDzGo7kj6gLDQbmQV0ZweGF8Jcf7OCnHdVb-kDatK3H8wdR4KBkTylVdKDMi_dIX4sM6OxlsGRrWx0L2gfL6BThu8DYyAe45FijnbVqBeEX9a">
<input accept="image/*" class="hidden" id="coverInput" onchange="previewArtwork(event)" type="file">
<div class="absolute inset-0 bg-surface-container-lowest/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface text-[24px]">edit</span>
</div>
</div>
<div class="flex gap-space-sm mt-space-md">
<button class="flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:text-primary transition-all text-label-sm font-label-sm shadow-sm active:scale-95" onclick="generateSmartCover()" type="button">
<span class="material-symbols-outlined text-[14px]">auto_awesome</span>
        AI Generate
      </button>
<button class="flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:text-primary transition-all text-label-sm font-label-sm shadow-sm active:scale-95" onclick="setPresetCover()" type="button">
<span class="material-symbols-outlined text-[14px]">palette</span>
        Color Wave
      </button>
</div>
<div class="w-full mt-space-xl flex flex-col gap-space-lg">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex justify-between items-center" for="playlistName">
<span>Name</span>
<span class="font-mono-num text-mono-num text-outline" id="nameCount">0/50</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 px-space-md bg-surface-container text-on-surface placeholder:text-outline/60 rounded-xl font-body-lg text-body-lg outline-none transition-all duration-200 focus:bg-surface-container-high focus:shadow-[0_0_0_2px_rgba(255,83,81,0.4)]" id="playlistName" maxlength="50" oninput="handleNameInput(this)" placeholder="Give your playlist a name" type="text">
<button class="hidden absolute right-3 text-outline hover:text-on-surface transition-colors p-1" id="clearNameBtn" onclick="clearInput()" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="playlistDesc">Description <span class="text-outline text-body-sm font-normal">(Optional)</span></label>
<textarea class="w-full p-space-md bg-surface-container text-on-surface placeholder:text-outline/60 rounded-xl font-body-md text-body-md outline-none transition-all duration-200 focus:bg-surface-container-high focus:shadow-[0_0_0_2px_rgba(255,83,81,0.4)] resize-none" id="playlistDesc" maxlength="150" placeholder="Add an optional description" rows="3"></textarea>
</div>
<div class="flex items-center justify-between p-space-md rounded-xl bg-surface-container-low shadow-sm">
<div class="flex items-center gap-space-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" id="privacyIcon">public</span>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface" id="privacyTitle">Public Playlist</span>
<span class="font-body-sm text-body-sm text-on-surface-variant" id="privacySubtitle">Anyone on Mmusic can find and listen</span>
</div>
</div>
<button aria-checked="true" class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full bg-primary-container p-0.5 transition-colors duration-200 ease-in-out" id="privacyToggle" onclick="togglePrivacy()" role="switch" type="button">
<span class="translate-x-5 pointer-events-none inline-block h-6 w-6 transform rounded-full bg-on-primary-container shadow-md transition duration-200 ease-in-out" id="toggleKnob"></span>
</button>
</div>
<div class="flex items-center justify-between p-space-md rounded-xl bg-surface-container-low shadow-sm">
<div class="flex items-center gap-space-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[20px]">group_add</span>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">Collaborative</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Invite friends to contribute tracks</span>
</div>
</div>
<button aria-checked="false" class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full bg-surface-variant p-0.5 transition-colors duration-200 ease-in-out" id="collabToggle" onclick="toggleCollab()" role="switch" type="button">
<span class="translate-x-0 pointer-events-none inline-block h-6 w-6 transform rounded-full bg-surface-bright shadow-md transition duration-200 ease-in-out" id="collabKnob"></span>
</button>
</div>
</div>
<div class="w-full mt-space-xl">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center shadow-[0_4px_20px_rgba(255,83,81,0.35)] opacity-50 cursor-not-allowed transition-all duration-200 active:scale-[0.98]" disabled="" id="submitBtn" onclick="triggerCreate()" type="button">
        Create Playlist
      </button>
</div>
</div>
</div>
<script>
  let isPublic = true;
  let isCollab = false;

  function handleNameInput(el) {
    const val = el.value.trim();
    const countEl = document.getElementById('nameCount');
    const clearBtn = document.getElementById('clearNameBtn');
    const submitBtn = document.getElementById('submitBtn');
    const navBtn = document.getElementById('navCreateBtn');

    countEl.textContent = `${el.value.length}/50`;

    if (el.value.length > 0) {
      clearBtn.classList.remove('hidden');
    } else {
      clearBtn.classList.add('hidden');
    }

    if (val.length > 0) {
      submitBtn.removeAttribute('disabled');
      submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      navBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    } else {
      submitBtn.setAttribute('disabled', 'true');
      submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
      navBtn.classList.add('opacity-50', 'cursor-not-allowed');
    }
  }

  function clearInput() {
    const input = document.getElementById('playlistName');
    input.value = '';
    handleNameInput(input);
    input.focus();
  }

  function togglePrivacy() {
    isPublic = !isPublic;
    const toggle = document.getElementById('privacyToggle');
    const knob = document.getElementById('toggleKnob');
    const title = document.getElementById('privacyTitle');
    const sub = document.getElementById('privacySubtitle');
    const icon = document.getElementById('privacyIcon');

    if (isPublic) {
      toggle.setAttribute('aria-checked', 'true');
      toggle.className = 'relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full bg-primary-container p-0.5 transition-colors duration-200 ease-in-out';
      knob.className = 'translate-x-5 pointer-events-none inline-block h-6 w-6 transform rounded-full bg-on-primary-container shadow-md transition duration-200 ease-in-out';
      title.textContent = 'Public Playlist';
      sub.textContent = 'Anyone on Mmusic can find and listen';
      icon.textContent = 'public';
    } else {
      toggle.setAttribute('aria-checked', 'false');
      toggle.className = 'relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full bg-surface-variant p-0.5 transition-colors duration-200 ease-in-out';
      knob.className = 'translate-x-0 pointer-events-none inline-block h-6 w-6 transform rounded-full bg-surface-bright shadow-md transition duration-200 ease-in-out';
      title.textContent = 'Private Playlist';
      sub.textContent = 'Only you and invited collaborators can view';
      icon.textContent = 'lock';
    }
  }

  function toggleCollab() {
    isCollab = !isCollab;
    const toggle = document.getElementById('collabToggle');
    const knob = document.getElementById('collabKnob');

    if (isCollab) {
      toggle.setAttribute('aria-checked', 'true');
      toggle.className = 'relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full bg-secondary-container p-0.5 transition-colors duration-200 ease-in-out';
      knob.className = 'translate-x-5 pointer-events-none inline-block h-6 w-6 transform rounded-full bg-on-secondary-container shadow-md transition duration-200 ease-in-out';
    } else {
      toggle.setAttribute('aria-checked', 'false');
      toggle.className = 'relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full bg-surface-variant p-0.5 transition-colors duration-200 ease-in-out';
      knob.className = 'translate-x-0 pointer-events-none inline-block h-6 w-6 transform rounded-full bg-surface-bright shadow-md transition duration-200 ease-in-out';
    }
  }

  function previewArtwork(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const preview = document.getElementById('coverPreview');
        const placeholder = document.getElementById('coverPlaceholder');
        preview.src = evt.target.result;
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }
  }

  function setPresetCover() {
    const preview = document.getElementById('coverPreview');
    const placeholder = document.getElementById('coverPlaceholder');
    preview.classList.remove('hidden');
    placeholder.classList.add('hidden');
  }

  function generateSmartCover() {
    const name = document.getElementById('playlistName').value || 'Sonic Haven';
    const preview = document.getElementById('coverPreview');
    const placeholder = document.getElementById('coverPlaceholder');
    preview.classList.remove('hidden');
    placeholder.classList.add('hidden');
  }

  function triggerCreate() {
    const nameInput = document.getElementById('playlistName');
    if (!nameInput.value.trim()) {
      nameInput.focus();
      return;
    }
    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';
    setTimeout(() => {
      history.back();
    }, 600);
  }
</script></main></body></html>
