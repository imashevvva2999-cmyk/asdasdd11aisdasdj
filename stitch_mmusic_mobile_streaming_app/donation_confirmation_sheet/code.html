ex-col min-h-screen pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex flex-col relative w-full flex-1 bg-surface-container-lowest"><div class="flex flex-col w-full relative min-w-0 pb-safe">
<!-- Dimmed Ambient Backdrop with subtle studio glow -->
<div class="fixed inset-0 bg-surface-container-lowest/80 backdrop-blur-md pointer-events-none transition-opacity duration-300"></div>
<!-- Sheet Container pushed to bottom ergonomic zone -->
<div class="relative w-full flex flex-col justify-end mt-auto pt-12">
<!-- Modal Card (Layer 3 Sheet) -->
<div class="w-full bg-surface-container-low rounded-t-[28px] px-margin pt-3 pb-8 shadow-2xl relative flex flex-col items-center">

<div class="w-10 h-1 rounded-full bg-surface-variant mb-6 transition-all duration-200"></div>

<div class="relative mb-4 flex items-center justify-center">

<img alt="Solaris Echo" class="w-16 h-16 rounded-full object-cover block shadow-lg bg-surface-container" src="https://lh3.googleusercontent.com/aida/AEtjO1VJ25AWM7I4SxuwfeC1-uugFEZsvulwg2ujl_N533S2IQQr3lkTSVMiLGRiq7ueU8360Mb97ceJBIGCWtwjEMA0Yu-HOdKtRFXp4V0sT8pB-TCx8grvmAuZ5ZBW3h0EinQKChM6pEEkr75VvFERxNSLtRVCL8-h6KzpKPV4u5twAhe9sEvJMj7XaiG-TYZz122Zmoj6rBF1kKUhLeCzepI6O9OM-842kucB9fS9P5Cw0ZjosNNc8IQ9Lc8">
</div>
<!-- Verified Creator Audio Badge -->
<div class="absolute -bottom-1 -right-1 bg-surface-container-highest p-1 rounded-full shadow-md flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<!-- Heading & Artist Title -->
<h2 class="font-headline-sm text-headline-sm text-on-surface text-center mb-1 font-bold">
        Support Solaris Echo
      </h2>
<p class="font-body-sm text-body-sm text-outline text-center mb-5">
        Electronic &amp; Ambient Synth Producer
      </p>
<!-- Prominent Donation Value Capsule -->
<div class="w-full bg-surface-container rounded-2xl p-4 mb-4 flex flex-col items-center justify-center text-center relative overflow-hidden">
<div class="absolute top-0 inset-x-0 h-0.5 bg-gradient-to-r from-transparent via-primary-container/50 to-transparent"></div>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary font-bold mb-1">
          Contribution Amount
        </span>
<div class="flex items-baseline justify-center gap-1.5 text-on-surface">
<span class="font-display-lg text-display-lg text-on-surface font-extrabold tracking-tight">50</span>
<span class="font-headline-md text-headline-md text-outline font-semibold">сом</span>
</div>
</div>
<!-- Integrated MBANK Account Surface (Frictionless In-Bank Rail) -->
<div class="w-full bg-surface-container-high rounded-xl p-3.5 mb-5 flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-surface-variant flex items-center justify-center shrink-0 text-secondary">
<span class="material-symbols-outlined text-[22px]">account_balance_wallet</span>
</div>
<div class="flex flex-col min-w-0 flex-1">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface font-medium truncate">
              MBANK account •••• 4892
            </span>
<span class="font-label-sm text-label-sm text-secondary bg-secondary-container/20 px-1.5 py-0.5 rounded">
              Direct
            </span>
</div>
<span class="font-body-sm text-body-sm text-outline mt-0.5">
            Available: 14,250 сом
          </span>
</div>
</div>
<!-- Trust & Direct Artist Guarantee -->
<div class="flex items-start gap-2.5 px-2 mb-6">
<span class="material-symbols-outlined text-[18px] text-tertiary shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">
          lock_open_right
        </span>
<p class="font-body-sm text-body-sm text-outline leading-tight">
          100% of your support goes directly to the artist's verified creator account. No gateway deduction.
        </p>
</div>
<!-- Action Cluster -->
<div class="w-full flex flex-col gap-2.5">
<!-- Confirm Button with Tactile Glow -->
<button class="w-full h-14 rounded-full bg-primary-container text-white font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(255,83,81,0.35)] active:scale-[0.98] transition-all cursor-pointer font-bold tracking-wide" id="confirm-donation-btn" type="button">
<span>Confirm &amp; Send 50 сом</span>
<span class="material-symbols-outlined text-[20px]">bolt</span>
</button>
<!-- Dismiss Action -->
<button class="w-full h-11 rounded-full bg-transparent hover:bg-surface-variant/40 active:scale-[0.98] text-outline font-label-md text-label-md flex items-center justify-center transition-colors cursor-pointer" id="cancel-donation-btn" type="button">
          Cancel
        </button>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const confirmBtn = document.getElementById('confirm-donation-btn');
    const cancelBtn = document.getElementById('cancel-donation-btn');

    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        this.innerHTML = `
          <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
          <span>Sending...</span>
        `;
        this.classList.add('opacity-90', 'pointer-events-none');
        
        setTimeout(() => {
          this.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">check_circle</span>
            <span>Sent to Solaris Echo!</span>
          `;
          this.classList.remove('bg-primary-container', 'shadow-[0_4px_20px_rgba(255,83,81,0.35)]');
          this.classList.add('bg-secondary', 'text-on-secondary-fixed');
        }, 850);
      });
    }

    if (cancelBtn) {
      cancelBtn.addEventListener('click', function() {
        const root = this.closest('.relative.w-full');
        if (root) {
          root.style.transition = 'transform 0.25s ease-out, opacity 0.2s ease-out';
          root.style.transform = 'translateY(16px)';
          root.style.opacity = '0.5';
        }
      });
    }
  })();
</script></main></body></html>
