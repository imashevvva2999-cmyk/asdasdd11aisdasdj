<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#131315;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary": "#621100", "on-background": "#e5e1e4", "on-secondary-container": "#4f3100", "on-secondary-fixed-variant": "#633f00", "primary-fixed": "#ffdad7", "surface-container-high": "#2a2a2c", "on-error-container": "#ffdad6", "on-tertiary-fixed": "#3c0700", "surface-container-low": "#1c1b1d", "surface-container": "#201f21", "primary-fixed-dim": "#ffb3ae", "on-primary-fixed": "#410004", "secondary-fixed-dim": "#ffb955", "on-primary": "#68000b", "outline-variant": "#5b403e", "on-surface-variant": "#e4bdba", "on-tertiary-fixed-variant": "#862208", "on-primary-container": "#5c0008", "tertiary-container": "#e96a4a", "surface-container-highest": "#353437", "surface": "#131315", "error": "#ffb4ab", "on-surface": "#e5e1e4", "on-secondary-fixed": "#291800", "tertiary": "#ffb4a2", "surface-variant": "#353437", "secondary-container": "#dc9100", "inverse-on-surface": "#313032", "surface-container-lowest": "#0e0e10", "primary-container": "#ff5351", "outline": "#ab8886", "on-error": "#690005", "on-primary-fixed-variant": "#930014", "error-container": "#93000a", "on-secondary": "#452b00", "surface-tint": "#ffb3ae", "background": "#131315", "primary": "#ffb3ae", "surface-dim": "#131315", "secondary-fixed": "#ffddb4", "tertiary-fixed": "#ffdad2", "secondary": "#ffb955", "inverse-surface": "#e5e1e4", "surface-bright": "#39393b", "on-tertiary-container": "#560e00", "tertiary-fixed-dim": "#ffb4a2", "inverse-primary": "#bb1522" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "2rem", "gutter": "1rem", "margin": "1.25rem", "space-sm": "0.5rem", "space-lg": "1.25rem", "space-xs": "0.25rem", "space-md": "0.75rem" }, "fontFamily": { "display-lg-mobile": ["Plus Jakarta Sans"], "body-md": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "mono-num": ["Inter"], "label-md": ["Inter"], "label-sm": ["Inter"], "body-lg": ["Inter"], "body-sm": ["Inter"], "label-lg": ["Inter"], "display-lg": ["Plus Jakarta Sans"] }, "fontSize": { "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.025em", "fontWeight": "800" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "mono-num": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "500" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "12px", "letterSpacing": "0.06em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }], "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "800" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-space-sm flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Artist Setup</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center mr-space-xs"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface px-margin"><div class="flex flex-col w-full pb-10">
<!-- Subtle Ambient Glow -->
<div class="relative w-full overflow-hidden">
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-64 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Stepper Context Header -->

<!-- Visual Avatar Upload Zone -->
<div class="flex flex-col items-center mb-4">
<div class="relative group cursor-pointer" id="avatar-container">
<!-- Ambient Art Glow -->
<div class="absolute -inset-2 bg-gradient-to-tr from-primary-container/20 to-secondary/20 rounded-full blur-xl opacity-60 group-hover:opacity-100 transition-opacity duration-300"></div>
<!-- Central Circular Container -->
<div class="relative w-32 h-32 rounded-full bg-surface-container-low flex flex-col items-center justify-center overflow-hidden shadow-xl transition-transform duration-200 active:scale-95">
<img class="w-full h-full object-cover opacity-80 group-hover:opacity-90 transition-opacity" data-alt="Intimate monochromatic portrait of a contemporary musical artist with soft atmospheric rim lighting and deep shadow contrasts in a late night studio" id="avatar-preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBkmXwgm6xXqRHfK3Vvojz-fhu-qPzN6LhVwUfeZz0Yd22s5dxLFqa1T1aZn1XUikbQrZEHkiORhZf7kjt7JnyMavb0JRtOal9CU6473QvwMTl57EaXR2LA4mYSKpaHAzUD8dOfzcUeFwTsNSI219OiiwOqt7bW5-m6afk0MQ_2bh5zMyI8BZ4OAwFYfcB-9YtnT2MtRv3GSXFChc0nF6flqAovWFoRPfeQIUgsEmQLGeFinqSeHNXM">
<div class="absolute inset-0 bg-surface-container-lowest/40 flex flex-col items-center justify-center p-2 backdrop-blur-[2px]">
<div class="w-10 h-10 rounded-full bg-surface-container-high/90 flex items-center justify-center text-primary mb-1 shadow-md">
<span class="material-symbols-outlined text-[22px]">add_a_photo</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center font-medium">Update Photo</span>
</div>
</div>
<button aria-label="Quick camera shot" class="absolute bottom-1 right-1 w-9 h-9 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
</button>
</div>
<div class="mt-3 text-center">
<span class="font-label-md text-label-md text-on-surface font-semibold block">Artist Photo</span>

</div>
</div>
<!-- Form Fields Card -->
<div class="bg-surface-container-low/80 rounded-xl p-space-md shadow-md space-y-space-md">
<!-- 1. Stage Name -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="artist-name">
<span class="">Artist / Stage Name</span>

</label>
<div class="relative">
<input class="w-full h-11 px-3.5 rounded-lg bg-surface-container text-on-surface placeholder:text-outline/70 font-headline-sm text-headline-sm focus:outline-none focus:bg-surface-container-high transition-colors" id="artist-name" placeholder="e.g. Solaris Echo, Elena Rostova" type="text" value="Solaris Echo">
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/40 pointer-events-none">
<span class="material-symbols-outlined text-[20px]">verified</span>
</div>
</div>
</div>
<!-- 2. Primary Genre Selector -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between">
<span class="">Primary Genre</span>

</label>
<!-- Interactive Genre Filter Chips -->
<div class="flex flex-wrap gap-2 pt-1" id="genre-container">
<button class="genre-chip h-8 px-3.5 rounded-full font-label-md text-label-md transition-all duration-150 flex items-center gap-1.5 bg-primary text-on-primary shadow-sm" data-genre="Electronic / Ambient" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-on-primary"></span>
            Electronic / Ambient
          </button>
<button class="genre-chip h-8 px-3.5 rounded-full font-label-md text-label-md transition-all duration-150 flex items-center gap-1.5 bg-surface-container text-on-surface-variant hover:text-on-surface" data-genre="Traditional Kyrgyz" type="button">
            Traditional Kyrgyz
          </button>
<button class="genre-chip h-8 px-3.5 rounded-full font-label-md text-label-md transition-all duration-150 flex items-center gap-1.5 bg-surface-container text-on-surface-variant hover:text-on-surface" data-genre="Indie Rock" type="button">
            Indie Rock
          </button>
<button class="genre-chip h-8 px-3.5 rounded-full font-label-md text-label-md transition-all duration-150 flex items-center gap-1.5 bg-surface-container text-on-surface-variant hover:text-on-surface" data-genre="Pop" type="button">
            Pop
          </button>
<button class="genre-chip h-8 px-3.5 rounded-full font-label-md text-label-md transition-all duration-150 flex items-center gap-1.5 bg-surface-container text-on-surface-variant hover:text-on-surface" data-genre="Hip-Hop" type="button">
            Hip-Hop
          </button>
</div>
</div>
<!-- 3. Short Bio -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="artist-bio">Short Bio</label>

</div>
<textarea class="w-full p-3 rounded-lg bg-surface-container text-on-surface placeholder:text-outline/70 font-body-md text-body-md resize-none focus:outline-none focus:bg-surface-container-high transition-colors leading-relaxed" id="artist-bio" maxlength="300" placeholder="Tell your story and musical journey in a few sentences..." rows="3">Blending analog synths with mountainous ambient echoes from Central Asia.</textarea>
</div>
<!-- 4. Location / City -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="artist-location">Location / Base City</label>
<div class="relative">
<div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-primary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[18px]">location_on</span>
</div>
<input class="w-full h-11 pl-10 pr-3.5 rounded-lg bg-surface-container text-on-surface font-body-md text-body-md focus:outline-none focus:bg-surface-container-high transition-colors" id="artist-location" placeholder="City, Country" type="text" value="Bishkek, Kyrgyzstan">
</div>
</div>
</div>
<!-- Verification / Legal Note Card -->

<!-- Sticky Floating Action Panel -->
<div class="mt-6 pt-2 flex flex-col gap-2">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm font-semibold tracking-wide flex items-center justify-center gap-2 shadow-[0_4px_24px_rgba(255,83,81,0.35)] active:scale-[0.98] transition-transform" id="submit-btn" type="button">
<span class="">Create Artist Profile</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="text-center font-mono-num text-mono-num text-on-surface-variant/60">By creating a profile, you agree to Mmusic’s Artist Terms.</p>
</div>
</div>
</div>
<script>
  (function() {
    // Bio character counter
    const bioTextarea = document.getElementById('artist-bio');
    const bioCounter = document.getElementById('bio-count');
    
    if (bioTextarea && bioCounter) {
      const updateCount = () => {
        bioCounter.textContent = `${bioTextarea.value.length}/300`;
      };
      bioTextarea.addEventListener('input', updateCount);
      updateCount();
    }

    // Genre selection interactions
    const genreContainer = document.getElementById('genre-container');
    if (genreContainer) {
      genreContainer.addEventListener('click', (e) => {
        const chip = e.target.closest('.genre-chip');
        if (!chip) return;

        const isSelected = chip.classList.contains('bg-primary');
        
        // Remove selection from all
        genreContainer.querySelectorAll('.genre-chip').forEach(c => {
          c.className = 'genre-chip h-8 px-3.5 rounded-full font-label-md text-label-md transition-all duration-150 flex items-center gap-1.5 bg-surface-container text-on-surface-variant hover:text-on-surface';
          const dot = c.querySelector('span.w-1\\.5');
          if (dot) dot.remove();
        });

        // Toggle selected state
        if (!isSelected) {
          chip.className = 'genre-chip h-8 px-3.5 rounded-full font-label-md text-label-md transition-all duration-150 flex items-center gap-1.5 bg-primary text-on-primary shadow-sm';
          const dot = document.createElement('span');
          dot.className = 'w-1.5 h-1.5 rounded-full bg-on-primary';
          chip.insertBefore(dot, chip.firstChild);
        }
      });
    }

    // Micro press interaction feedback on avatar
    const avatar = document.getElementById('avatar-container');
    if (avatar) {
      avatar.addEventListener('click', () => {
        avatar.classList.add('scale-95');
        setTimeout(() => avatar.classList.remove('scale-95'), 140);
      });
    }
  })();
</script></main>

</body></html>
