<script>
  (() => {
    const playBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const karaokeToggle = document.getElementById('karaoke-toggle');
    const micIcon = document.getElementById('mic-icon');
    const micText = document.getElementById('mic-text');
    const lyricsLines = document.querySelectorAll('.lyric-line');
    let isPlaying = true;
    let isKaraoke = false;

    playBtn?.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      playBtn.classList.toggle('bg-primary-container', isPlaying);
      playBtn.classList.toggle('bg-surface-bright', !isPlaying);
      playBtn.classList.toggle('text-on-primary-container', isPlaying);
      playBtn.classList.toggle('text-on-surface', !isPlaying);
    });

    karaokeToggle?.addEventListener('click', () => {
      isKaraoke = !isKaraoke;
      if (isKaraoke) {
        karaokeToggle.classList.replace('bg-surface-container', 'bg-primary-container');
        karaokeToggle.classList.replace('text-on-surface-variant', 'text-on-primary-container');
        micIcon.style.fontVariationSettings = "'FILL' 1";
        micText.textContent = "Karaoke On";
      } else {
        karaokeToggle.classList.replace('bg-primary-container', 'bg-surface-container');
        karaokeToggle.classList.replace('text-on-primary-container', 'text-on-surface-variant');
        micIcon.style.fontVariationSettings = "'FILL' 0";
        micText.textContent = "Vocal Sync";
      }
    });

    lyricsLines.forEach(line => {
      line.addEventListener('click', () => {
        lyricsLines.forEach(l => {
          l.classList.remove('opacity-100');
          l.classList.add('opacity-35');
          const p = l.querySelector('p');
          p?.classList.remove('font-extrabold', 'text-primary-container', 'drop-shadow-[0_2px_12px_rgba(255,83,81,0.45)]');
          l.querySelector('.timestamp-label')?.classList.add('hidden');
        });

        line.classList.remove('opacity-30', 'opacity-35', 'opacity-40');
        line.classList.add('opacity-100');
        const activeText = line.querySelector('p');
        activeText?.classList.add('text-primary-container');
        line.querySelector('.timestamp-label')?.classList.remove('hidden');
      });
    });

    const activeEl = document.getElementById('active-line');
    if (activeEl) {
      activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  })();
</script></main>
