<script>
  (function() {
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playPauseIcon = document.getElementById('play-pause-icon');
    let isPlaying = true;

    if (playPauseBtn && playPauseIcon) {
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
    }

    const likeBtn = document.getElementById('like-toggle-btn');
    const likeIcon = document.getElementById('like-icon');
    let isLiked = false;

    if (likeBtn && likeIcon) {
      likeBtn.addEventListener('click', () => {
        isLiked = !isLiked;
        if (isLiked) {
          likeIcon.style.fontVariationSettings = "'FILL' 1";
          likeBtn.classList.add('text-primary');
          likeBtn.classList.remove('text-on-surface-variant');
        } else {
          likeIcon.style.fontVariationSettings = "'FILL' 0";
          likeBtn.classList.remove('text-primary');
          likeBtn.classList.add('text-on-surface-variant');
        }
      });
    }

    const shuffleBtn = document.getElementById('shuffle-btn');
    let shuffleActive = false;
    if (shuffleBtn) {
      shuffleBtn.addEventListener('click', () => {
        shuffleActive = !shuffleActive;
        shuffleBtn.classList.toggle('text-primary', shuffleActive);
        shuffleBtn.classList.toggle('text-on-surface-variant/70', !shuffleActive);
      });
    }

    const repeatBtn = document.getElementById('repeat-btn');
    let repeatActive = false;
    if (repeatBtn) {
      repeatBtn.addEventListener('click', () => {
        repeatActive = !repeatActive;
        repeatBtn.classList.toggle('text-primary', repeatActive);
        repeatBtn.classList.toggle('text-on-surface-variant/70', !repeatActive);
      });
    }

    const scrubberTrack = document.getElementById('scrubber-track');
    const scrubberProgress = document.getElementById('scrubber-progress');
    const scrubberThumb = document.getElementById('scrubber-thumb');
    const elapsedElem = document.getElementById('elapsed-time');
    const remainingElem = document.getElementById('remaining-time');
    const totalDurationSeconds = 225;

    if (scrubberTrack && scrubberProgress && scrubberThumb) {
      const handleSeek = (e) => {
        const rect = scrubberTrack.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const percentage = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const percentString = (percentage * 100).toFixed(1) + '%';
        scrubberProgress.style.width = percentString;
        scrubberThumb.style.left = percentString;

        const currentSec = Math.floor(percentage * totalDurationSeconds);
        const remSec = totalDurationSeconds - currentSec;
        const cMin = Math.floor(currentSec / 60);
        const cSec = currentSec % 60;
        const rMin = Math.floor(remSec / 60);
        const rSec = remSec % 60;

        if (elapsedElem) elapsedElem.textContent = `${cMin}:${cSec < 10 ? '0' : ''}${cSec}`;
        if (remainingElem) remainingElem.textContent = `-${rMin}:${rSec < 10 ? '0' : ''}${rSec}`;
      };

      scrubberTrack.addEventListener('click', handleSeek);
    }
  })();
</script></main>
