<script>
  function switchState(stateId) {
    const states = ['state-uploading', 'state-processing', 'state-success', 'state-error'];
    states.forEach(function(id) {
      const el = document.getElementById(id);
      if (el) {
        if (id === stateId) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      }
    });

    const buttons = document.querySelectorAll('.state-tab-btn');
    buttons.forEach(function(btn) {
      if (btn.getAttribute('data-target') === stateId) {
        btn.classList.add('bg-surface-container-high', 'text-on-surface', 'font-semibold', 'shadow-sm');
        btn.classList.remove('text-on-surface-variant');
      } else {
        btn.classList.remove('bg-surface-container-high', 'text-on-surface', 'font-semibold', 'shadow-sm');
        btn.classList.add('text-on-surface-variant');
      }
    });
  }
</script></main>
