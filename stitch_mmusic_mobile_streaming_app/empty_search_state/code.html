<script>
  (function() {
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-search-btn');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const likeBtn = document.getElementById('like-track-btn');
    const exploreBtn = document.getElementById('explore-genres-btn');
    const trendChips = document.querySelectorAll('.trend-chip');

    if (clearBtn && searchInput) {
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.focus();
      });
    }

    if (playPauseBtn) {
      let isPlaying = true;
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        const icon = playPauseBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = isPlaying ? 'pause' : 'play_arrow';
        }
      });
    }

    if (likeBtn) {
      let isLiked = false;
      likeBtn.addEventListener('click', () => {
        isLiked = !isLiked;
        const icon = likeBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          likeBtn.classList.toggle('text-primary', isLiked);
          likeBtn.classList.toggle('text-on-surface-variant', !isLiked);
          icon.style.fontVariationSettings = isLiked ? "'FILL' 1" : "'FILL' 0";
        }
      });
    }

    trendChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const textSpan = chip.querySelector('span:last-child');
        if (textSpan && searchInput) {
          searchInput.value = textSpan.textContent.trim();
          searchInput.focus();
        }
      });
    });

    if (exploreBtn && searchInput) {
      exploreBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.placeholder = 'Search genres, moods, or tempo';
        searchInput.focus();
      });
    }
  })();
</script></main>
